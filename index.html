<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- navbar -->
<div class="navbar">
  <div class="nav-item">Home</div>
  <div class="nav-item" id="currentUser">Not logged in</div>
<div class="nav-item" style="margin-left:auto;">
  <button class="small-btn" onclick="openModal('loginModal')" id="loginBtn">Login</button>
  <button class="small-btn" onclick="openModal('signupModal')" id="signupBtn">Sign Up</button>
  <button class="small-btn" onclick="logoutUser()" id="logoutBtn" >Logout</button>
</div>
</div>

<!-- sidebar / content -->
<div class="main-container">

  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Filters</h3>
    <input type="text" id="filterInput" placeholder="Filter tasks...">

    <h3>Sort Tasks</h3>
    <select id="sortSelect" onchange="applyFilterAndSort()">
      <option value="">-- Select --</option>
      <option value="title-asc">Title ↑</option>
      <option value="title-desc">Title ↓</option>
      <option value="user-asc">User ↑</option>
      <option value="user-desc">User ↓</option>
    </select>
  </div>




  <!-- Content -->
  <div class="content">
    <h1>Task Manager</h1>

    <div class="container">
      <!-- Create Task -->
      <div class="task-form">
        <h2>Create Task</h2>
        <input id="taskTitle" type="text" placeholder="Task Title">
        <textarea id="taskDesc" placeholder="Description"></textarea>
        <button onclick="addTask()">Add Task</button>
      </div>

      <!-- Task List -->
      <h2>All Tasks</h2>
      <div id="taskList"></div>
    </div>
  </div>

</div>

<!-- Signup -->
<div id="signupModal" class="modal">
  <div class="modal-content">
    <h2>Sign Up</h2>
    <input id="signupUsername" type="text" placeholder="Username">
    <input id="signupPassword" type="password" placeholder="Password">
    <button onclick="signupUser()">Sign Up</button>
    <button onclick="closeModal('signupModal')">Cancel</button>
  </div>
</div>

<!-- Login -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <h2>Login</h2>
    <input id="loginUsername" type="text" placeholder="Username">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="loginUser()">Login</button>
    <button onclick="closeModal('loginModal')">Cancel</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
